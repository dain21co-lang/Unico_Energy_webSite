async function open_(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(pt);}
async function go(pw,silent){try{const h=await open_(pw);try{sessionStorage.setItem("gmp",pw)}catch(e){}document.open();document.write(h);document.close();}catch(e){if(!silent)document.getElementById("e").textContent="비밀번호가 맞지 않습니다.";}}
