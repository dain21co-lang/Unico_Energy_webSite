<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>강화 제1광산 · 사업 기획(안)</title>
<meta property="og:title" content="강화 제1광산 · 사업 기획(안)">
<meta property="og:description" content="강화 장석광산 기반 조력발전 인프라 소재 플랫폼 · H&L Partners">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1422;--bg2:#0e1a2b;--gold:#c9a96e;--champ:#ecdcb6;--sub:#a9b6c8;--line:#2c405c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(120% 90% at 50% 40%,#13253d 0%,var(--bg) 70%);color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(201,169,110,.18);background:rgba(10,20,34,.6);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:12px}
.dia{width:26px;height:26px;border:1.4px solid var(--gold);transform:rotate(45deg);display:flex;align-items:center;justify-content:center}
.dia b{transform:rotate(-45deg);color:var(--gold);font-size:12px;font-family:"Cormorant Garamond",serif}
.logo span{font-size:13px;font-weight:700;letter-spacing:.06em}
.logo em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px;font-size:11.5px}
.hr{font-size:11px;letter-spacing:.2em;color:var(--sub)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 18px;position:relative;min-height:0}
.frame{position:relative;width:min(100%,calc((100vh - 200px)*16/9));aspect-ratio:16/9;border:1px solid rgba(201,169,110,.35);box-shadow:0 30px 80px rgba(0,0,0,.55);background:#0e1a2b;overflow:hidden}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.frame img.in{animation:wipe .75s cubic-bezier(.16,1,.3,1) both}
.frame img.inb{animation:wipeb .75s cubic-bezier(.16,1,.3,1) both}
@keyframes wipe{from{clip-path:inset(0 0 0 100%);transform:scale(1.04)}to{clip-path:inset(0 0 0 0);transform:scale(1)}}
@keyframes wipeb{from{clip-path:inset(0 100% 0 0);transform:scale(1.04)}to{clip-path:inset(0 0 0 0);transform:scale(1)}}
.tap{position:absolute;top:0;bottom:0;width:30%;z-index:2;cursor:pointer}.tap.l{left:0}.tap.r{right:0}
.note{position:absolute;left:22px;bottom:4px;font-size:10.5px;color:#7a8aa2}
.rot{display:none;position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11.5px;color:var(--champ)}
footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px 16px;position:relative}
.pg .c{font-size:10.5px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.pg .n{font-family:"Cormorant Garamond",serif;font-size:26px;line-height:1.1}.pg .n small{font-size:14px;color:var(--sub)}
.btns{display:flex;gap:8px}
button{font:inherit;background:transparent;color:#fff;border:1px solid var(--line);height:40px;padding:0 16px;font-size:12px;letter-spacing:.12em;cursor:pointer}
button.next{background:var(--gold);color:#0a1422;border-color:var(--gold);font-weight:700}
button.on{border-color:var(--gold);color:var(--gold)}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold);transition:width .5s cubic-bezier(.16,1,.3,1)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,16,28,.97);overflow:auto;padding:70px 20px 30px;transform:translateY(100%);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.ov.show{transform:none}
.ov h3{position:fixed;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;letter-spacing:.2em;color:var(--gold);background:#0a1422;border-bottom:1px solid rgba(201,169,110,.18);z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.grid a{display:block;cursor:pointer;color:#fff;text-decoration:none}
.grid img{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);display:block}
.grid a.cur img{border-color:var(--gold)}
.grid p{font-size:11.5px;margin-top:6px;color:var(--sub)}.grid p b{color:var(--gold);margin-right:6px;font-family:"Cormorant Garamond",serif;font-size:14px}
@media (max-width:760px){
 header{height:50px;padding:0 14px}.hr{display:none}.logo em{display:none}
 .stage{padding:10px 8px 26px}.frame{width:100%}
 .rot{display:block}.note{display:none}
 footer{flex-wrap:wrap;padding:10px 12px 14px}.btns{width:100%;justify-content:space-between}
 button{padding:0 10px;font-size:11px;letter-spacing:.06em;flex:1}button.fs{flex:none;width:42px}
 .pg{width:100%;display:flex;align-items:baseline;justify-content:space-between}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
@media (orientation:landscape) and (max-height:520px){
 header{display:none}.stage{padding:6px}.frame{width:min(100%,calc((100vh - 64px)*16/9))}.rot,.note{display:none}
 footer{flex-wrap:nowrap;padding:6px 12px 8px}.pg{width:auto;display:block}.pg .n{font-size:20px}.btns{width:auto}button{height:34px;flex:none}
}
</style></head>

<div class="rot">휴대폰을 가로로 돌리면 크게 볼 수 있습니다 · 좌우로 밀어 넘기기</div></div>
